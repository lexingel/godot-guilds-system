name: tests

on:
  push:
  pull_request:

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project
        run: ./godot --headless --path . --import || true
      - name: Run tests
        run: |
          set -o pipefail
          ./godot --headless --path . res://tests/run_tests.tscn 2>&1 | tee test-output.txt
          # A GDScript runtime error stops a test without failing a check.
          if grep -q "SCRIPT ERROR" test-output.txt; then echo "Script errors during tests"; exit 1; fi
